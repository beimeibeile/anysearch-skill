[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anysearch-skill"
version = "3.0.1"
description = "深度搜索技能 - 23垂类领域+结构化输出，多语言CLI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "AnySearch Team"}]
keywords = ["search", "deep-search", "research", "multi-language", "cli"]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
anysearch = "scripts.anysearch_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
